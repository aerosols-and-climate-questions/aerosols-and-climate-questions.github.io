chapterTitle: Chapter 06
categories:
  - id: review
    name: Review
    questions:
      - id: question-r01
        type: multiple-choice
        prompt: If you wanted to quantify the aerosol radiative forcing including atmospheric adjustments in a global model (i.e., the effective radiative forcing, or ERF), which model would you use and why?
        options:
          - A chemical transport model because the 3-D fields of atmospheric motion are fully specified and unaffected by the aerosol, so you can easily compare simulations with different aerosol emissions.
          - A 20-year run of an atmosphere-only climate model because the aerosol effects on the atmosphere that are relevant to aerosol forcing take at least a decade to occur.
          - An ensemble of 5-year simulations of an atmosphere-only climate model because the…
          - A coupled atmosphere-ocean climate model because the full effects of aerosol on surface temperatures needs to be simulated for the adjustments to be realistic.
          - A nudged atmosphere-only climate model.
        correctIndex: 2
        answer: You would ideally use an ensemble of 5-year simulations of an atmosphere-only climate model. The aerosol forcing including atmospheric adjustments is defined as the change in net downward radiative flux at the top of atmosphere caused by a radiative perturbation to the Earth including adjustments to the atmosphere without a change in surface temperature (which elminates the option of using a fully coupled atmosphere-ocean model). The adjustments to the atmosphere occur on timescales of days to months, so a 5-year simulation is sufficient to capture these effects. A single 5-year simulation would be insufficient because the internal variability of the climate system would make it difficult to distinguish the aerosol forcing from natural variability. An ensemble of simulations allows you to average over this internal variability and obtain a more robust estimate of the aerosol forcing. A chemical transport model would not be appropriate because it does not allow for the atmosphericadjustments. A 20-year run of an atmosphere-only climate model would be unnecessary because the adjustments to the atmosphere occur on much shorter timescales. Nudged models are often used for quantifing ERFs. Nudging is used to keep the model close to observed meteorology, which can be useful for comparing with observations, but it is not necessary for quantifying ERFs, and such simulations have the disadvantage that some adjustments may not be properly represented. 
      - id: question-r02
        type: multiple-choice
        prompt: How many quantities would a model need to transport if it represented aerosol as a sectional particle size distribution with size 20 bins, with each bin carrying the chemical species sulfate, nitrate and black carbon?
        options:
          - "20"
          - "60"
          - "80"
          - "120"
        correctIndex: 2
        answer: A model would need to transport 80 quantities. This is because there are 20 bins, and each bin carries 3 chemical species, so the total number of chemical tracers is 20 * 3 = 60. However, to specify the size distribution, the model also needs to transport the total number of particles in each bin, which adds an additional 20 quantities. Therefore, the total number of quantities that need to be transported is 60 + 20 = 80.
      - id: question-r03
        type: multiple-choice
        prompt: How many quantities would a model need to transport if it represented aerosol as 3 lognormal particle size distributions of varying number concentration and size but constant shape, with each bin carrying the chemical species sulfate, nitrate and black carbon?
        options:
          - "12"
          - "15"
          - "24"
          - "36"
        correctIndex: 0
        answer: A model would need to transport 3 quantities for each of the 3 lognormal particle size distributions, totaling 3 * 3 = 9 quantities. However, to specify the size distribution, the model also needs to transport the total number of particles in each distribution, which adds an additional 3 quantities. Therefore, the total number of quantities that need to be transported is 9 + 3 = 12.
      - id: question-r04
        type: multiple-choice
        prompt: Which of the following describes how aerosols are treated in an atmosphere-only climate model?
        options:
          - Aerosols are transported by 3-D wind fields that are read in from reanalysis products. The model calculates the aerosol chemical, microphysical and radiative properties online, which generates 3-D time-resolved model outputs. These calculated properties do not alter the atmospheric dynamics of the model.
          - Aerosols are transported by 3-D fields of atmospheric motion calculated each time step by the model. The model calculates the aerosol chemical, microphysical and radiative properties online, which generates 3-D time-resolved model outputs. These calculated properties alter the atmospheric dynamics of the model. The ocean is not simulated, so the surface temperature is fixed to a climatology.
          - Aerosols are transported by 3-D fields of atmospheric motion calculated each time step by the model. The model calculates the aerosol chemical, microphysical and radiative properties online, which generates 3-D time-resolved model outputs. These calculated properties alter the atmospheric dynamics of the model. The ocean is simulated, so the surface temperature is free to evolve and feeds back on the aerosol properties.    
        correctIndex: 1
        answer: Aerosols are transported by 3-D fields of atmospheric motion calculated each time step by the model. The first option describes a chemical transport model (CTM) and the third option describes a coupled atmosphere-ocean model.
      - id: question-r05
        type: multiple-choice
        prompt: Which of the following is always true of a two-moment cloud microphysics model?
        options:
          - It is needed to calculate aerosol-cloud interaction forcing because a single-moment model cannot calculate the effect of aerosol on droplet number.
          - It always simulates particle number and mass.
          - It can simulate an evolving particle size distribution, but some properties of the distribution still need to be specified.
          - It can simulate all the properties of a particle size distribution.
        correctIndex: 2
        answer: A two-moment cloud microphysics model can simulate an evolving particle size distribution, but some properties of the distribution still need to be specified. The two moments typically represent the total number of particles and the total mass of particles, which allows the model to simulate changes in the size distribution over time. However, with just two moments, other properties of the distribution may still need to be specified or assumed. For example, a lognormal aerosol distribution is fully specified by three quantities (mean, standard deviation, and total number), so a two-moment model does not fully capture all properties. A two-moment model does not always simulate particle number and mass, as it depends on how the moments are defined. A two-moment model is not always necessary to calculate aerosol-cloud interaction forcing, as some single-moment models can also simulate the effect of aerosol on droplet number.
  - id: application
    name: Application
    questions:
      - id: question-a01
        type: basic
        prompt: You are involved in a field campaign to measure aerosol properties in the Arctic in order to understand their impact on climate. You have a budget to deploy either a single instrument that measures aerosol size distribution or a single instrument that measures aerosol chemical composition. Which would you choose and why?
        answer: I would choose to deploy the instrument that measures aerosol size distribution. This is because the size distribution of aerosols is a key factor in determining their effect on solar radiation (Figure 2.7, section 4.1.2 and section 11.1.2.2) and their ability to act as cloud condensation nuclei (CCN, section 4.1.2, 5.4.1 and 12.2.1.2). Additionally, the size distribution can provide insights into the sources and processes affecting aerosols in the Arctic, such as long-range transport, local emissions, and atmospheric processing. Chemical composition is also important for particle hygroscopicity and therefore size, scattering efficiency (Fig 5.7) and droplet formation (Fig 5.9), understanding the size distribution is crucial for assessing the overall climate impact of aerosols in this region.
      - id: question-a02
        type: basic
        prompt: As a modeller, you are involved in a field campaign to measure aerosol and cloud properties over a marine region. You aim to use the measurements to evaluate and improve your model and quantify the effect on estimates of global mean aerosol forcing. What modelling approach would you choose and why?
        answer: I would choose an atmosphere-only climate model because it allows for the simulation of aerosol-cloud interactions and their impact on effective radiative forcing (ERF), while also being computationally efficient and suitable for evaluation against field measurements. The model would need to be run in two different ways. Firstly, for evaluation against measurements made under specific meteorological conditions, the model could be nudged to match a reanalysis, such as from ECMWF. You would also prescribe sea-surface temperatures to match the period. Without nudging, the model would still be useful for understanding the general behavior of aerosol-cloud interactions, but the free-running atmospheric dynamics would not enable comparison with measurements except in a general statistical sense. For the forcing calculation, this same model could be run without nudging for 5 years. For further information, see section 6.2 and Box 6.1
      - id: question-a03
        type: multiple-choice
        prompt: Is this chart about radiative forcings or climate feedbacks?
        image:
          src: ../imgs/forcings.png
          alt: Sample forcing chart used to demonstrate image questions
          caption: Images stay inside the question box and keep their proportions.
        options:
          - Feedbacks
          - Forcings
        correctIndex: 1
        answer: It's forcings, shown on the x-axis
  - id: mastery
    name: Mastery
    questions:
      - id: question-m01
        prompt: In a global model, it is common to treat the particle size distribution as modes of varying size and number concentration, with each mode carrying all chemical components. In reality, as air containing sulfate aerosol passes over ocean it picks up sea salt particles that don’t immediately mix with the sulfate particles. Assuming the particles are all the same size, what is the consequence for cloud drop concentrations of treating the particles as an “internal” mixture (all components in the same particles) versus treating it as an “external” mixture?
        answer: Not sure how to answer this.
      - id: question-m02
        type: numeric
        prompt: What is the standard acceleration due to gravity at Earth's surface?
        units: m s^-2
        answer: 9.81
        answerInfo: This is the conventional standard gravity.
        tolerance: 0.01
      - id: question-m03
        type: select-multiple
        prompt: Which of the following are greenhouse gases?
        options:
          - Carbon dioxide (\(\mathrm{CO}_2\))
          - Methane (\(\mathrm{CH}_4\))
          - Oxygen (\(\mathrm{O}_2\))
          - Water vapor (\(\mathrm{H}_2\mathrm{O}\))
        correctIndex: [0, 1, 3]
        answer: The greenhouse gases are carbon dioxide, methane, and water vapor. Oxygen is not a greenhouse gas.
      - id: question-m04
        type: basic
        hint: Use an online graph plotting software to visualise the functional form of the autoconversion rate parametrisation.
        prompt: Equation 6.20 on page 216 presents the Khairoutdinov and Kogan autoconversion rate parametrisation, in which the autoconversion rate depends on cloud liquid water, q<sub>c</sub> and cloud droplet number concentration, N<sub>d</sub>. The exponent, x = -1.79 controls the dependence of the autoconversion rate on N<sub>d</sub>. Relative to the control value, how would you expect the sensitivity of the model output to changes in N<sub>d</sub> to vary as a) x -> -∞, b) x -> 0? <br> <br>  Explain your reasoning in terms of the mathematical form of the parametrisation and the physical processes represented.
        answer: a) As x -> -∞, the exponent on N<sub>d</sub> becomes more negative which increases the sensitivity of the model output to droplet number concentration. For larger N<sub>d</sub>, autoconversion is suppressed more strongly, leading to larger changes in precipitation and cloud water. <br> <br> b) As x -> 0, autoconversion becomes increasingly insensitive to N<sub>d</sub>, and in the limit of a zero exponent the autoconversion rate is independent of droplet number concentration.
