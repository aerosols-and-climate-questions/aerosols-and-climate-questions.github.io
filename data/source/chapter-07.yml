chapterTitle: Chapter 07
categories:
  - id: review
    name: Review
    questions:

    - id: question-r01
      type: multiple-choice
      prompt: Which observational network is most closely associated with long-term ground-based measurements of aerosol optical depth (AOD)?
      options:
        - IMPROVE
        - GAW
        - AERONET
        - CALIPSO
      correctIndex: 2
      answer: AERONET is the global network of sun photometers that provides long-term aerosol optical depth measurements.

    - id: question-r02
      type: multiple-choice
      prompt: During which period was the phenomenon commonly referred to as "global dimming" most strongly observed?
      options:
        - 1900–1930
        - 1940–1980
        - 1980–2000
        - 2000–present
      correctIndex: 1
      answer: Global dimming was most strongly observed between approximately 1940 and 1980, when surface solar radiation declined over many industrialized regions.

    - id: question-r03
      type: multiple-choice
      prompt: Satellite-derived aerosol climate records began approximately in which year?
      options:
        - "1958"
        - "1968"
        - "1978"
        - "1988"
      correctIndex: 2
      answer: The satellite aerosol record extends back to approximately 1978, providing near-global observations of aerosol properties.

    - id: question-r04
      type: multiple-choice
      prompt: What was the approximate peak decline in surface solar radiation associated with global dimming over many land regions?
      options:
      - 0.2–0.5 W m⁻²
      - 1–2 W m⁻²
      - 2–5 W m⁻²
      - 10–15 W m⁻²
      correctIndex: 2
      answer: Declines in surface solar radiation during the dimming period were typically of order 2–5 W m⁻² over many land regions.

    - id: question-r05
      type: multiple-choice
      prompt: Industrial sulfur emissions in Europe and North America broadly reached their maximum during which decade?
      options:
      - 1930s
      - 1950s
      - 1970s
      - 1990s
      correctIndex: 2
      answer: Sulfur emissions generally peaked during the 1970s before declining due to air-quality legislation.

    - id: question-r06
      type: multiple-choice
      prompt: Approximately how many stations are included in the modern AERONET network?
      options:
      - About 40
      - About 100
      - More than 400
      - More than 2000
      correctIndex: 2
      answer: The modern AERONET network contains more than 400 stations distributed across the globe.

    - id: question-r07
      type: multiple-choice
      prompt: Which one of the following is a major limitation of ice-core reconstruction of aerosol trends?
      options:
      - ice cores record only sulphate
      - deposition depends on transport and scavenging processes as well as atmospheric abundance
      - ice cores only preserve volcanic signals
      - records can be difficult to date with a time resolution better than 5-10 years
      correctIndex: 1
      answer: Ice-core deposition records reflect both atmospheric concentrations and the processes controlling transport and deposition. This is a limitation, but the other options are not correct.

    - id: question-r08
      type: multiple-choice
      prompt: Measurements of which atmospheric property were used to infer an increase in aerosol pollution over the ATlantic from the early 1900s to the 1960s? 
      options:
          - Surface solar radiation
          - Visibility
          - Atmospheric conductivity
          - Cloud coverage
      correctIndex: 2
      answer: Atmospheric conductivity was used to infer an increase in aerosol pollution over the Atlantic from the early 1900s to the 1960s. See section 7.2.5. A brief history of early aerosol measurements is also given in Chapter 2.

    - id: question-r09
      type: multiple-choice
      prompt: What is the approximate global mean aerosol optical depth (AOD) at 550 nm during the satellite era?
      options:
        - 0.01–0.03
        - 0.12–0.16
        - 0.30–0.50
        - 0.80–1.00
      correctIndex: 1
      answer: Global mean aerosol optical depth at 550 nm is approximately 0.12–0.16 based on modern observational datasets.

    - id: question-r10
      type: multiple-choice
      prompt: Which of the following is a major limitation of satellite aerosol retrievals?
      options:
        - They cannot provide global coverage
        - They cannot provide long-term records
        - They cannot distinguish between aerosol types
        - They cannot measure aerosol optical depth
      correctIndex: 2
      answer: Satellite retrievals can provide global coverage and long-term records, and they can measure aerosol optical depth. However, they have difficulty distinguishing between different aerosol types.

    - id: question-r11
      type: multiple-choice
      prompt: China's aerosol optical depth trend is best described as which one of the following?
      options:
        - Continuous decrease since 1990
        - Continuous increase since 1990
        - Increase until around 2007–2010 followed by decline
        - No significant trend
      correctIndex: 2
      answer: China experienced increasing aerosol loading until roughly 2007–2010, followed by substantial declines associated with emission controls.

    - id: question-r12
      type: multiple-choice
      prompt: The global mean aerosol optical depth trend since 1990 is approximately what?
      options:
        - Increase of 20% dominated by emerging economies
        - Little overall change because regional trends offset each other
        - Decrease of 10% dominated by emission controls in Europe and North America
        - Recovery to approximately preindustrial conditions
      correctIndex: 1
      answer: Global mean AOD changed only modestly because large regional decreases and increases largely compensated each other.  

    - id: question-r13
      type: multiple-choice
      prompt: What can be said about trends in CCN-sized particles over Europe over the first decade of the 21st century?
      options:
        - A downward trend of about 4% per year consistent with declining aerosol emissions
        - There are too few sites to determine a trend
        - Heterogeneous trends with some regions showing increases and others decreases
        - A downward trend of about 4% per year over industrialised regions but an upward trend of about 4% per year over remote and boreal regions consistent with natural feedbacks
      correctIndex: 2
      answer: Heterogeneous trends were observed over Europe, with some regions showing increases and others decreases. See section 7.3.4.

    - id: question-r14
      type: multiple-choice
      prompt: How have trends in sulphur emissions and particulate sulphate concentrations changed over Europe over the period 1990–2010?
      options:
        - Emissions decreased by over 70% and particulate sulphate concentrations decreased by about the same amount
        - Emissions decreased by around 30% and particulate sulphate concentrations decreased by about the same amount
        - Emissions increased by over 70% and particulate sulphate concentrations decreased by less than this amount
        - Emissions increased by around 30% and particulate sulphate concentrations decreased by about over 70%
      correctIndex: 2
      answer: Emissions decreased by over 70% and particulate sulphate concentrations decreased by less than this amount. See Fig. 7.1.2.

    - id: question-r15
      type: select-multiple
      prompt: In addition to measured trends in aerosol optical depth, which of the following trebds have also been measured since the late 1990s? Select all that apply.
      options:
        - Major soluble ions (sulphate, ammonium, nitrate)
        - PM\(_{2.5}\) mass concentrations
        - Total particle number concentrations
        - Cloud condensation nuclei (CCN) concentrations
        - Particle size distributions
        - Aerosol absorption properties
      correctIndex: [0,1,2,5]
      answer: Table 7.2 shows that major soluble ions, PM\(_{2.5}\) mass concentrations, and total particle number concentrations have been measured since the late 1990s. CCN concentrations and particle size distributions have not been measured over this period, but usually only in intensive field campaigns. Table 7.3 shows that aerosol absorption properties have been measured since the late 1990s. 

  
