        answer: TBC.
        author: Ken Carslaw
      - id: question-a02
        type: basic
        prompt: Why might a single air inlet to measure aerosol utilise both a PM2.5 filter and a PM10 filter in series?
        answer: To avoid larger particles clogging the instrument.
        lastUpdated: "2026-06-27"
        author: Erin Raif
        reviewer: Ken Carslaw
      - id: question-a03
        prompt: An IAGOS aircraft measurement of a wildfire plume at the tropopause reports a black carbon concentration of 154 s cm-3.
        parts:  
          - label: (a)
            type: numeric
            prompt: Given that the measurement was made at 250 hPa and -19.0 °C, calculate the ambient concentration recorded by the instrument. 
            answer: 40.8
            units: cm-3
            tolerance: 0.1
            answerInfo: 40.8 cm\(^{-3}\). Using the ideal gas law, \(PV=nRT\), the ratio between the volume of ambient air and air at STP is \(T_{\mathrm{amb.}}P_{\mathrm{STP}}/T_{\mathrm{STP}}P_{\mathrm{amb.}}\). To convert between STP and ambient concentrations, divide by this ratio. Since this was IAGOS data, found on EDAS (Sec. 9.3.2), the value of STP is 1013 hPa. If you used the IUPAC value of 1000 hPa, you would have calculated 41.3 cm-3. That's probably close enough for our purposes, but it could lead to confusion in some cases!
          - label: (b)
            type: basic
            prompt: When using these measurements to set a vertical profile of aerosol concentration, a modeller fails to spot that the concentration is in s cm-3, instead thinking it is in cm-3. What would be the consequence of this error?
            answer: The aerosol concentration would be increasingly overestimated with altitude as the air density decreases.
        answer: Aerosol measurements cannot be understood independently from the atmospheric conditions they were made in!
        author: Erin Raif
        reviewer: Ken Carslaw
      - id: question-a04
        type: basic
        prompt: A scientist wishes to obtain a particle-size distribution of sodium chloride aerosol via an unheated inlet using an online technique. Aside from the ambient temperature and pressure, which atmospheric quantity should they measure?
        answer: Relative humidity. Sodium chloride is a strongly hygroscopic aerosol and will swell at high humidities. This can be corrected for using the hygroscopic growth factor, but the relative humidity must be known.
        lastUpdated: "2026-06-27"
        author: Erin Raif
        reviewer: Ken Carslaw
  - id: mastery
    name: Mastery
    questions:
      - id: question-m01
        type: basic
        prompt: An optical particle counter with high temporal resolution and high size resolution is used to make a particle size distribution measurement of an aerosol species. It is found that the species has an unexpectedly low number concentration. Why might averaging the data over a lower time resolution improve one's confidence in the reported measurement?
        answer: Optical particle counters count the number of aerosols of a given size observed in a certain time interval. This is then combined with a measurement of the volume of air to calculate the concentration. Since the aerosol is not abundant, at the high time resolution there are likely to be many size bins which report very few counts, often on the order of 0 to 4. Counts of aerosol are subject to the Poisson distribution, where the error on the counted number is its square root. For counts this low, this ranges between 50 and 100%. By decreasing the temporal resolution, there will be more counts per size bin, reducing the error on the counting statistic. Since the magnitude of error on the volume of air typically does not significantly change between measurements, the error on the reported concentration will be smaller at lower time resolution.
      - id: question-m02
        type: multiple-choice
        prompt: A mineral dust particle which is known to have a volume-equivalent diameter of a few microns has properties \(\rho_{\mathrm{p}} = 2.6\ \mathrm{g\ cm^{-3}}\) and \(\chi = 2\) at all pressures. Would its electric mobility diameter (measured at STP) be larger or smaller than its vacuum aerodynamic diameter? Assume that \(\rho_{\mathrm{0}} = 1\ \mathrm{g\ cm^{-3}}\). <i>You will probably find it useful to use the first-order Taylor approximation,</i> \(e^{x}= 1+x\).
        options:
          - Larger
          - Smaller
        correctIndex: 0
        hint: Take the ratio of the two diameters. After making a Taylor expansion, consider the relative magnitude of the terms in the Taylor expansion and eliminate those which are small.
        answer: >-
          <p>The electric mobility diameter (\(d_{\mathrm{m}}\)) is larger than the vacuum aerodynamic diameter (\(d_{\mathrm{va}}\)). Referring to Eq. 9.2 and Eq. 9.4 of the book to take the ratio of the two diameters,</p>
          <p>\(\frac{d_{\mathrm{m}}}{d_{\mathrm{va}}} = \frac{d_{\mathrm{m}}/d_{\mathrm{v}}}{d_{\mathrm{va}}/d_{\mathrm{v}}} = \frac{\chi\left[C_\mathrm{c}(d_\mathrm{m})/C_\mathrm{c}(d_\mathrm{v})\right]}{\rho_\mathrm{p}/\rho_\mathrm{0}\chi}\)</p>
          <p>where \(d_{\mathrm{v}}\) is the volume-equivalent diameter.</p>
          <p>\(\frac{d_{\mathrm{m}}}{d_{\mathrm{va}}} = \frac{\chi^{2}\rho_\mathrm{0}}{\rho_\mathrm{p}}\left[\frac{1+\frac{2\lambda}{d_\mathrm{m}}\left(\alpha+\beta\exp{(-\gamma d_\mathrm{m}/2\lambda)}\right)}{1+\frac{2\lambda}{d_\mathrm{v}}\left(\alpha+\beta\exp{(-\gamma d_\mathrm{v}/2\lambda)}\right)}\right]. \)</p>
          <p>Using the Taylor expansion in the question,</p>
          <p>\( \frac{d_{\mathrm{m}}}{d_{\mathrm{va}}} \approx \frac{\chi^{2}\rho_\mathrm{0}}{\rho_\mathrm{p}}\left[\frac{1+\frac{2\lambda\alpha}{d_\mathrm{m}}+\frac{2\lambda\beta}{d_\mathrm{m}}-\beta\gamma}{1+\frac{2\lambda\alpha}{d_\mathrm{v}}+\frac{2\lambda\beta}{d_\mathrm{v}}-\beta\gamma}\right] = \frac{\chi^{2}\rho_\mathrm{0}}{\rho_\mathrm{p}}\frac{d_\mathrm{v}}{d_\mathrm{m}}\left[\frac{d_\mathrm{m}+2\lambda\alpha+2\lambda\beta-\beta\gamma d_\mathrm{m}}{d_\mathrm{v}+2\lambda\alpha+2\lambda\beta-\beta\gamma d_\mathrm{v}}\right].\)</p>
          <p>Since the diameter of the particles is a few microns and this is much longer than the mean free path of air molecules at STP \(\lambda\approx 0.066\ \mu\mathrm{m}\), we can ignore the terms with \(\lambda\).</p>
          <p>\( \frac{d_{\mathrm{m}}}{d_{\mathrm{va}}} = \frac{\chi^{2}\rho_\mathrm{0}}{\rho_\mathrm{p}}\frac{d_\mathrm{v}}{d_\mathrm{m}}\left[\frac{d_\mathrm{m}-\beta\gamma d_\mathrm{m}}{d_\mathrm{v}-\beta\gamma d_\mathrm{v}}\right] = \frac{\chi^{2}\rho_\mathrm{0}}{\rho_\mathrm{p}}\frac{d_\mathrm{v}}{d_\mathrm{m}}\frac{d_\mathrm{m}}{d_\mathrm{v}}\left[\frac{1-\beta\gamma}{1-\beta\gamma}\right] = \frac{\chi^{2}\rho_\mathrm{0}}{\rho_\mathrm{p}}\)</p>
          <p>Using the values of \(\chi\), \(\rho_\mathrm{0}\) and \(\rho_\mathrm{p}\) given in the question, \(d_{\mathrm{m}}/d_{\mathrm{va}} \approx 1.5\) so in this case the electric mobility diameter is larger than the vacuum aerodynamic diameter. However, mobility spectrometers rarely operate at super-micron sizes.</p>
      - id: question-m03
        type: basic
        prompt: An aircraft campaign uses a variety of online instruments to measure aerosol and clouds. Suggest the best format to store and share the resulting data and, by researching beyond the book, suggest a Python package which is ideally suited to analysing data in this format. Why would CSV files be an inappropriate choice?
        answer: NetCDF files allow multi-dimensional data. This means that the time, latitude, longitude and altitude of measurements can all be indexed alongside the measurement, meaning that it is easy for anyone analysing the data to quickly identify trends according to location. Additionally, since multiple data arrays can be stored in a single NetCDF file, different instruments easily can be compared at the same time, so it is trivial to, for instance, create size distributions using two instruments measuring different aerosol size ranges. NetCDFs also allow flexible metadata, meaning all information relating to the dataset can be stored in a single file. The Python package xarray allows users to make such plots with single lines of code, and allows filtering of data across multiple axes. Using CSVs would require a large amount of preparatory work to handle input and output and makes it difficult to track data. 
