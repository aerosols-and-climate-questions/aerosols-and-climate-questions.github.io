      - id: question-r05
        type: multiple-choice
        prompt: An air sampler uses a PM2.5 filter. What proportion of aerosols with diameter 2.5 µm would you expect to pass through this PM2.5 filter?
        options:
          - 0%
          - 50%
          - 100%
        hint: Consider how the transmission rate changes as the diameter changes, and how this applies to the PM2.5 filter.
        correctIndex: 1
        answer: 50%. People commonly mistakenly think this is 0%.
        author: Erin Raif
        reviewer: Ken Carslaw
      - id: question-r06
        type: multiple-choice
        prompt: A technique to measure INPs involves applying droplets of purified water to a filter which collects aerosols. Is this technique online or offline?
        options:
          - Online
          - Offline
        correctIndex: 1
        answer: Offline, the analysis is performed after collection.
        author: Erin Raif
        reviewer: Ken Carslaw
      - id: question-r07
        type: multiple-choice
        prompt: What is the time resolution of a filter measurement?
        options:
          - The length of time each filter is exposed to aerosol
          - The time between different filter measurements
          - The time between the collection of the filter and the analysis of the filter
        correctIndex: 0
        author: Erin Raif
        reviewer: Ken Carslaw
      - id: question-r08
        prompt: A scientist is measuring coarse-mode aerosol using an instrument that uses a sampling line.
        parts:
          - label: (a)
            type: multiple-choice
            prompt: Which are the most likely sources of particle losses?
            options:
              - Diffusion and impaction
              - Diffusion and electrostatic
              - Electrostatic and impaction
              - Impaction and gravitational settling
              - Gravitational settling and diffusion
            correctIndex: 3
            answer: Impaction and gravitational settling losses dominate when the particle diameter is large.
          - label: (b)
            type: basic
            prompt: What physical shape of line would mitigate these best?
            answer: A straight vertical line.
        answer: Different physical processes dominate particle losses depending on the particle size.
        author: Erin Raif
        reviewer: Ken Carslaw
