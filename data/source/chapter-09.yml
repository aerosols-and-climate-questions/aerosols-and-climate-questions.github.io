        type: multiple-choice
        prompt: An aerosol-climate model with a precise aerosol emission inventory has too few aerosols in the upper troposphere. What is a plausible reason for this?
        options:
          - Aerosol mixes too quickly in a grid-box, so aerosols form droplets too rapidly leading to too-efficient precipitation.
          - A decoy option
          - A decoy option
        correctIndex: 0
        answer: Need to flesh this out.
        author: Erin Raif
