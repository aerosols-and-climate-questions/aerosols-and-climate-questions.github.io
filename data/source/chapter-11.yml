  - id: mastery
    name: Mastery
    questions:
      - id: template-m01
        parts:
          - label: (a)
            type: numeric
            prompt: A sulphate aerosol layer with a single-scatter albedo of 1.0 is measured to transmit 36.8% of the incident solar radiation with the sun directly overhead. What is the intensity of the scattered solar radiation relative to the transmitted solar radiation? Assume an upscatter fraction of 0.5.
            answer: 88
            units: "%"
            tolerance: 2
            answerInfo: The transmitted solar radiation is 36.8% of the incident solar radiation, so optical depth of the layer is \(\tau = -\ln(0.368)\). The scattered solar radiation below the layer is \((1-\exp(-\tau)) \times (1 - 0.5) = 0.632 \times 0.5 = 0.316\). This is 88% of the transmitted solar radiation.
            hint: See Fig 11.6.
          - label: (b)
            type: basic
            prompt: How would the intensity of the scattered solar radiation change for a very dense aerosol layer with an optical depth of 5?
            answer: The transmitted solar radiation would be extremely small (\(\exp(-5)\)). However, the amount of solar radiation scattered downward would still be about 50%. 
