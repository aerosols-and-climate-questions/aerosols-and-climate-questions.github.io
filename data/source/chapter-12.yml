      - id: question-m04
        type: basic
        prompt: Compute the radiative forcing due to aerosol-cloud interactions for different values of the drop number sensitivity to aerosol, \(\partial\ln N_d / \partial\ln \tau_a\), and for different relative perturbations in aerosol optical depth. Use files with geographical distributions of cloud fraction \(f_{cld}\), incoming radiation \(R^\downarrow\), cloud optical thickness \(\tau_c\), as well as \(\tau_a\). In simplification of Eq. 12.17 assume \(A_{cloudy} = A_c\).  
        answer: Need to provide files and a calculation.
        hint: Make use of Eq. 12.10 to get \(A_c\) from \(\tau_c\) and of Eq. 12.14 to get \(\partial A/\partial N_d\). Then evaluate Eq. 12.51.
        author: Johannes Quaas
        reviewer: Nobody

