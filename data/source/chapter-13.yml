chapterTitle: Chapter 13
categories:
  - id: review
    name: Review
    questions:

    - id: question-r01
      type: multiple-choice
      prompt: What is the effect of Northern Hemisphere aerosol cooling on the Intertropical Convergence Zone (ITCZ)?
      options:
        - Shifts northward
        - Shifts southward
        - Becomes more intense
        - Reduces seasonal variability
      correctIndex: 1
      answer: Cooling concentrated in the Northern Hemisphere causes the ITCZ to shift southward toward the relatively warmer hemisphere.

    - id: question-r02
      type: multiple-choice
      prompt: What is the change in the interhemispheric temperature difference that is attributed to anthropogenic aerosol during the twentieth century?
      options:
          - 0.01 K
          - 0.1 K
          - 1.0 K
          - 5.0 K
      correctIndex: 1
      answer: Anthropogenic aerosol contributed to an interhemispheric temperature difference of roughly 0.1 K.

    - id: question-r03
      type: multiple-choice
      prompt: During the mid-1980s Sahel drought, rainfall fell to approximately what fraction of its climatological mean?
      options:
          - 90%
          - 80%
          - 60%
          - 20%
      correctIndex: 2
      answer: Sahel rainfall during the major drought period fell to roughly 60% of its long-term mean.

    - id: question-r04
      type: multiple-choice
      prompt: Northern Hemisphere aerosol emissions are generally associated with what effect on Northern Hemisphere monsoons?
      options:
          - Strengthening precipitation
          - No effect
          - Weakening precipitation
          - Reversal of seasonal winds
      correctIndex: 2
      answer: Northern Hemisphere aerosol cooling weakens monsoon circulations and reduces monsoon rainfall.

    - id: question-r05
      type: multiple-choice
      prompt: Model studies indicate that anthropogenic aerosol contributed approximately what reduction in Northern Hemisphere monsoon precipitation between 1951 and 2005?
      options:
          - 1–3%
          - 5–11%
          - 20–30%
          - ">50%"
      correctIndex: 1
      answer: Simulations suggest aerosol forcing reduced Northern Hemisphere monsoon precipitation by about 5–11%.

    - id: question-r06
      type: multiple-choice
      prompt: An observed drying trend over South Asia from 1950 to 2002 has been attributed largely to anthropogenic aerosol. What is the approximate magnitude of this drying trend?
      options:
          - 0.018 mm day⁻¹ decade⁻¹, about 0.7%
          - 0.18 mm day⁻¹ decade⁻¹, about 7%
          - 0.58 mm day⁻¹ decade⁻¹, about 22.5%
          - 1.8 mm day⁻¹ decade⁻¹, about 70%
      correctIndex: 1
      answer: The South Asian monsoon exhibited a drying trend of approximately 0.18 mm day⁻¹ decade⁻¹.

    - id: question-r07
      type: select-multiple
      prompt: Aerosol forcing is considered important for understanding variability in which of the following climate phenomena? Select all that apply.
      options:
          - Atlantic Multidecadal Variability (AMV)
          - Atlantic Meridional Overturning Circulation (AMOC)
          - ENSO
          - Pacific Decadal Oscillation (PDO)
      correctIndex: [0, 1, 2, 3]
      answer: Aerosol forcing has been implicated in all of these components of climate variabilty. See section 13.4.

    - id: question-r08
      type: multiple-choice
      prompt: Aerosol cooling in the Pacific is associated with which one of the following changes in Pacific climate variability?
      options:
          - weaker trade winds
          - stronger trade winds
          - elimination of ENSO
          - stronger thermohaline circulation only
      correctIndex: 1
      answer: Aerosol-induced cooling can strengthen trade winds and alter Pacific climate variability.

    - id: question-r09
      type: multiple-choice
      prompt: Which statement best describes aerosol-driven climate responses?
      options:
        - The effects are mostly local and do not influence distant regions
        - They are patchy and can produce remote teleconnections
        - They only affect locations directly above emissions
        - They operate only through changes in clouds and precipitation
      correctIndex: 1
      answer: Aerosol forcing is spatially heterogeneous and can influence distant regions through atmospheric teleconnections.


