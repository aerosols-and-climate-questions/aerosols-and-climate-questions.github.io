chapterTitle: Chapter 17
categories:
  - id: review
    name: Review
    questions:
      - id: question-r01
        type: multiple-choice
        prompt: Which volcanic forcing mechanisms explains why climate models that only reduce the solar constant tend to overestimate the cooling effect of volcanic eruptions?
        options:
          - They neglect sulphate aerosol formation.
          - They ignore volcanic ash.
          - They neglect longwave absorption and stratospheric heating by sulphate aerosol.
          - They underestimate aerosol optical depth.
        correctIndex: 2
        answer: They neglect longwave absorption and stratospheric heating by sulphate aerosol. Volcanic sulphate aerosol not only reflects solar radiation (causing a cooling effect) but also absorbs terrestrial and near-IR radiation, offsetting part of the cooling effect.
      - id: question-r02
        type: multiple-choice
        prompt: Two eruptions inject the same mass of SO\(_2\) into the stratosphere. Eruption A occurs in the tropical stratosphere close to the equator, while Eruption B occurs at high latitude in the Northern Hemisphere. Which is most likely?
        options:
          - Both produce identical global aerosol lifetimes.
          - Eruption B produces a longer-lasting global aerosol perturbation.
          - Eruption A produces a longer-lasting and more globally distributed aerosol cloud.
          - Latitude has little influence once SO₂ reaches the stratosphere.
        correctIndex: 2
        answer: Eruption A produces a longer-lasting and more globally distributed aerosol cloud. This is because aerosol injected into the tropical stratosphere is transported more widely and remains in the atmosphere longer. An eruption at high latitude is more likely to be confined to the hemisphere of the eruption and to be removed more quickly by stratosphere-troposphere exchange.