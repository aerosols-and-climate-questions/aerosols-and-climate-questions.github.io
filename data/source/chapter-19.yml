chapterTitle: Chapter 19
categories:
  - id: review
    name: Review
    questions:
      - id: question-r01
        type: select-multiple
        prompt: Which of the following are short-lived climate forcers?
        options:
          - Sulphur dioxide (SO\(_2\))
          - Ozone (O\(_3\))
          - Ammonia (NH\(_3\))
          - Organic carbon (OC)
          - Nitrous oxide (N\(_2\)O)
        correctIndex: [0, 1, 2, 3]   
        answer: Short-lived climate forcers (SLCFs) are gases and aerosols that have a much shorter lifetime in the atmosphere than typical climate change policy horizons of decades. They remain in the atmosphere for days to a few years compared to centuries for some greenhouse gases. In this list, nitrous exide is a very long-lived greenhouse gas, not to be confused with nitrogen dioxide (NO\(_2\)), which forms nitric acid and affects aerosol.

      - id: question-r02
        type: multiple-choice
        prompt: Carbon dioxide and aerosol precursor gases like sulphur dioxide are often co-emitted by industry. What would happen if the emission of both of these gases were suddenly reduced by 10%?
        options:
          - Both the positive radiative forcing of CO\(_2\) and the negative radiative forcing of sulphate aerosol would decline within a few days
          - The positive radiative forcing of CO\(_2\) would continue to rise and the negative radiative forcing of sulphate aerosol would decline within a few days
          - The positive radiative forcing of CO\(_2\) and the negative radiative forcing of sulphate aerosol would decline by about 10% over a few years.
        correctIndex: 1
        answer: Carbon dioxide radiative forcing would continue to rise and the negative radiative forcing of sulphate aerosol would decline within a few days. About half of the emitted carbon dioxide remains in the atmosphere (the rest taken up by the ocean and land), so a 10% reduction in emissions would reduce the rate of rise by about 5%. Both sulphur dioxide and the sulphate aerosol that it produces are shortlived (see typical timescales in Fig. 5.10), so within a few days to weeks the global sulphate aerosol abundance would have fallen by 10% to a new steady level. The difference in timescales is important for climate policy and carbon budgets. Reduced aerosol emissions require lower carbon emissions for the same climate change target. 

      - id: template-r02
        type: multiple-choice
        prompt: What is the third letter of the Greek alphabet?
        options:
          - \(\alpha\)
          - \(\beta\)
          - \(\gamma\)
        correctIndex: 2
        answer: It's \(\gamma\), which is the third letter of the Greek alphabet.
  - id: application
    name: Application
    questions:
      - id: template-a01
        type: numeric
        prompt: What is the value of π (pi)?
        answer: 3.14
        answerInfo: Pi is the ratio of a circle's circumference to its diameter, so it is dimensionless.
        tolerance: 0.01
        hint: Optional hint for numeric questions.
      - id: template-a02
        type: multiple-choice
        prompt: Is this chart about radiative forcings or climate feedbacks?
        image:
          src: ../imgs/forcings.png
          alt: Sample forcing chart used to demonstrate image questions
          caption: Images stay inside the question box and keep their proportions.
        options:
          - Feedbacks
          - Forcings
        correctIndex: 1
        answer: It's forcings, shown on the x-axis
  - id: mastery
    name: Mastery
    questions:
      - id: template-m01
        parts:
          - label: (a)
            prompt: Write one short sentence explaining what makes a question multi-part.
            answer: A multi-part question has two or more subquestions that are answered separately.
          - label: (b)
            type: numeric
            prompt: Evaluate \(\ 2^3 + 1 \).
            answer: 9
            tolerance: 0
      - id: template-m02
        type: numeric
        prompt: What is the standard acceleration due to gravity at Earth's surface?
        units: m s^-2
        answer: 9.81
        answerInfo: This is the conventional standard gravity.
        tolerance: 0.01
      - id: template-m03
        type: select-multiple
        prompt: Which of the following are greenhouse gases?
        options:
          - Carbon dioxide (\(\mathrm{CO}_2\))
          - Methane (\(\mathrm{CH}_4\))
          - Oxygen (\(\mathrm{O}_2\))
          - Water vapor (\(\mathrm{H}_2\mathrm{O}\))
        correctIndex: [0, 1, 3]
        answer: The greenhouse gases are carbon dioxide, methane, and water vapor. Oxygen is not a greenhouse gas.